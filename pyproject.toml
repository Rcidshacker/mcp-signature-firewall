[project]
name = "mcp-signature-firewall"
version = "0.1.0"
description = "Measured cost and latency optimizer for an LLM attack classifier on MCP traffic"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[project.scripts]
sigfw = "sigfw.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sigfw"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM endpoint (run with -m live; never part of the kill path)"]
addopts = "-m 'not live'"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
